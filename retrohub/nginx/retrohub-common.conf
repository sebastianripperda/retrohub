# RetroHub 9.1.1 – App-Ursprung (HTTP 80 / HTTPS 443). Eingebunden von sites-available/retrohub.
root /var/www/retrohub;
index index.html;
charset utf-8;
server_tokens off;
autoindex off;
client_max_body_size 1m;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Cross-Origin-Isolation: nötig für Emulatoren mit Threads (PSP, MS-DOS)
add_header Cross-Origin-Embedder-Policy "require-corp" always;
# Emulatoren laufen auf einem eigenen Ursprung (Port 8080/8443) und werden nur dort eingebettet.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; frame-src http://$host:8080 https://$host:8443; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

error_page 404 /404.html;

location = /            { try_files /index.html =404; expires -1; }
location = /index.html  { expires -1; }
location = /health.json { expires -1; }
location = /404.html    { internal; }
location = /retrohub-ca.crt { default_type application/x-x509-ca-cert; expires -1; }
location /assets/       { try_files $uri =404; expires 1h; }

# Spieldateien hochladen (bis 2 GB, z. B. PSP-ISO) – direkt durchreichen
location = /api/admin/library/upload {
    client_max_body_size 2100m;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
# Spieldaten und BIOS an den Browser streamen
location ~ ^/api/(library/[0-9]+/data|bios/[A-Za-z0-9]+)$ {
    proxy_buffering off;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900s;
}
location ~ ^/api/admin/bios/[A-Za-z0-9]+$ {
    client_max_body_size 70m;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# Vollständige Sicherung (mit Spieldateien) – kann mehrere GB groß sein
location = /api/admin/backup/full {
    proxy_buffering off;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}
location = /api/admin/restore/full {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
location ~ ^/api/admin/library/[0-9]+/cover$ {
    client_max_body_size 3m;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# Emulator-Spielstände (bis 160 MB)
location ~ ^/api/saves/[^/]+/[^/]+/bin$ {
    client_max_body_size 170m;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}
# Backend (nur lokal erreichbar, Port 3000)
location /api/ {
    client_max_body_size 50m;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
location = /ws {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

location ~ /\.          { return 404; }
location /              { try_files $uri =404; }
