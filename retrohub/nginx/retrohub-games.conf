# RetroHub 9.1.1 – Emulator-Ursprung (HTTP 8080 / HTTPS 8443). Emulatoren laufen getrennt von der App:
# eigener Ursprung (kein Zugriff auf App-Seite), Netzwerk nur zum eigenen Ursprung, Einbettung nur durch die App.
root /var/lib/retrohub/games;
charset utf-8;
server_tokens off;
autoindex off;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# Einbettung in die cross-origin-isolierte App (Threads/SharedArrayBuffer für PSP und MS-DOS)
add_header Cross-Origin-Embedder-Policy "require-corp" always;
# Inhalte hier sind öffentlich (ohne Anmeldung); Einbettung bleibt über frame-ancestors auf die App beschränkt.
# "same-site" scheitert in Chromium beim Zugriff über eine IP-Adresse.
add_header Cross-Origin-Resource-Policy "cross-origin" always;
add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors http://$host https://$host" always;
location = /   { return 404; }
# Netplay (experimentell): Socket.IO-Verbindung und Raumliste an den RetroHub-Server (nur mit Anmeldung)
location /socket.io/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    client_max_body_size 170m;
}
location = /netplay/list {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
}
# Emulator-Oberfläche (eigener Code) und nachgeladene Emulator-Kerne
location ^~ /_emu/ejs/ { alias /var/lib/retrohub/emu/ejs/; expires 7d; }
location ^~ /_emu/     { alias /opt/retrohub/emu/; expires -1; }
location ~ /\. { return 404; }
location /     { try_files $uri =404; expires 1d; }
